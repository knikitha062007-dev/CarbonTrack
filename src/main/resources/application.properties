spring.application.name=CarbonTracker

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/carbontrack
spring.datasource.username=postgres
spring.datasource.password=Priya@1508
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.security.oauth2.client.registration.google.client-id=Your_key
spring.security.oauth2.client.registration.google.client-secret=Your_key


spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.data.redis.timeout=60000
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis=DEBUG
gemini.api.key=your_gimni_api_key
