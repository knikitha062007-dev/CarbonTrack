spring.application.name=CarbonTracker

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/carbontrack
spring.datasource.username=postgres
spring.datasource.password=Priya7$post
spring.datasource.driver-class-name=org.postgresql.Driver
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=gmail_id
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.security.oauth2.client.registration.google.client-id=google_cleint_id
spring.security.oauth2.client.registration.google.client-secret=secret_key


spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
#spring.data.redis.host=localhost
#spring.data.redis.port=6379
spring.cache.type=none
#spring.data.redis.timeout=60000
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis=DEBUG
gemini.api.key=api_key
